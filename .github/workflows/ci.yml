name: ci

on:
  push:
    branches: [main]
  pull_request:

# Runs on main queue rather than cancel. A run cancelled between its
# pushes leaves the api and web `main` tags naming different commits, and
# `main` is what compose.prod.yaml falls back to. Only one run waits per group
# and a newer push replaces it, so the newest commit still wins. A pull
# request has nothing to publish, so its older run is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only unless a job asks for more; `images` is the only one that does.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/engram-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/engram-web
  WALKER_IMAGE: ghcr.io/${{ github.repository_owner }}/engram-walker

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung run would otherwise hold main's queue for the six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Nothing here pushes with git, and every later step runs dependency
          # code that could otherwise read the token out of .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          # volta's pin, so CI runs the Node the code is developed on.
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same command the owner runs before committing: typecheck both
      # passes, lint, the Vitest suite and the node:test tools suite.
      # No database service: every test drives routes through `app.inject()`
      # with a stubbed db, which is the whole reason `buildApp` takes one.
      - run: pnpm run verify:cc

      # Generated and committed, so a stale copy is a real divergence rather
      # than noise: the router would resolve routes the source no longer has.
      # The Vite plugin regenerates it as a side effect of building, which is
      # why this builds rather than calling a generator — there is no CLI.
      - name: routeTree.gen.ts is current
        run: |
          pnpm --filter @engram/web run build
          git diff --exit-code -- apps/web/src/routeTree.gen.ts

      # Drizzle writes SQL and a meta snapshot from schema.ts. Hand-editing
      # either desynchronises them, and the failure surfaces as a migration
      # that does not match the types long after the commit that caused it.
      - name: migrations match the schema
        run: |
          pnpm --filter @engram/api run db:generate
          git diff --exit-code -- apps/api/drizzle

  images:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A repository variable, not a secret: it is in the bundle the moment
      # anyone views source. Asserted here so an unset one fails the run
      # rather than shipping an image that calls localhost in production.
      - name: the API origin is set
        run: |
          : "${VITE_API_ORIGIN:?set the VITE_API_ORIGIN repository variable}"
          echo "building web against $VITE_API_ORIGIN"
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}

      - id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main
      - id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main
      # No `main` tag: the slot runs a pinned sha- tag, and a tag that moves
      # on every push is one it could be pointed at instead.
      - id: walker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WALKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short

      # Built and smoked before any is pushed, so a failing smoke publishes
      # none. The pushes are still separate steps, which is why deploy.sh
      # checks the sha- manifests rather than trusting this. The second
      # build of each is a cache hit and costs almost nothing.
      - name: build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: engram-api:smoke
          cache-from: type=gha,scope=engram-api
          cache-to: type=gha,scope=engram-api,mode=max

      - name: build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: engram-web:smoke
          build-args: VITE_API_ORIGIN=${{ vars.VITE_API_ORIGIN }}
          cache-from: type=gha,scope=engram-web
          cache-to: type=gha,scope=engram-web,mode=max

      - name: build walker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: engram-walker:smoke
          cache-from: type=gha,scope=engram-walker
          cache-to: type=gha,scope=engram-walker,mode=max

      # The real entrypoint against a throwaway Postgres of the version the box
      # runs: every migration applied from empty by the migrator the image
      # carries, then config parsed and the server listening. A migration that
      # will not apply to an empty database, or a boot-path import the build
      # dropped, fails here rather than as a crash-loop there. One that only
      # breaks on existing rows still reaches the box; that is the backup's job.
      - name: smoke api
        run: |
          set -euo pipefail
          docker network create api-smoke >/dev/null
          trap 'docker logs api-smoke || true; docker rm -f api-smoke pg-smoke >/dev/null || true; docker network rm api-smoke >/dev/null || true' EXIT

          docker run -d --name pg-smoke --network api-smoke \
            -e POSTGRES_USER=engram -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=engram \
            postgres:18-alpine >/dev/null
          # Over TCP: the image initialises behind a socket-only server first,
          # and a socket check passes against that before the real one is up.
          pg=
          for _ in $(seq 1 30); do
            if docker exec pg-smoke pg_isready -q -h 127.0.0.1 -U engram; then pg=1; break; fi
            sleep 1
          done
          test -n "$pg" || { docker logs pg-smoke || true; echo "postgres never became ready" >&2; exit 1; }

          docker run -d --name api-smoke --network api-smoke \
            -e DATABASE_URL=postgres://engram:smoke@pg-smoke:5432/engram \
            -e WEB_ORIGIN=https://engram.invalid \
            -e GITHUB_OAUTH_CLIENT_ID=smoke -e GITHUB_OAUTH_CLIENT_SECRET=smoke \
            -e OWNER_GITHUB_USER_ID=1 \
            -e WEBHOOK_SECRET="$(openssl rand -hex 16)" \
            -e OAUTH_STATE_SECRET="$(openssl rand -hex 32)" \
            engram-api:smoke >/dev/null

          # `/ready`, not `/health`: it is the one that queries Postgres.
          ready=
          for _ in $(seq 1 30); do
            if docker exec api-smoke node -e "fetch('http://127.0.0.1:2012/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))" 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          test -n "$ready" || { echo "api never became ready" >&2; exit 1; }

      - name: smoke web
        run: |
          set -euo pipefail
          docker run -d --name web-smoke -p 2011:2011 engram-web:smoke
          # Logs and cleanup on the way out however this ends, so a failure
          # shows why rather than only that.
          trap 'docker logs web-smoke || true; docker rm -f web-smoke >/dev/null || true' EXIT

          ready=
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:2011/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test -n "$ready" || { echo "web never became ready" >&2; exit 1; }

          # A reload on /titles/<id> must reach the SPA rather than a 404 from
          # a server that has never heard of the route.
          curl -fsS http://127.0.0.1:2011/titles/deep-link >/dev/null

      # Nothing here can reach Plex, so this proves what can break in the image
      # rather than in the walk: it refuses to run with nowhere to post, and
      # with a target it gets as far as asking for the token. ES modules link
      # before any of them runs, so reaching that message means every import
      # resolved — a missing @engram/shared fails before it.
      - name: smoke walker
        run: |
          set -euo pipefail
          if out=$(docker run --rm engram-walker:smoke 2>&1); then
            echo "the walker ran with nowhere to post" >&2; exit 1
          fi
          grep -q 'ENGRAM_INGEST_URL' <<<"$out" || { echo "$out" >&2; exit 1; }

          out=$(docker run --rm -e ENGRAM_INGEST_URL=https://engram.invalid/ingest/plex-library \
            engram-walker:smoke 2>&1 || true)
          grep -q 'PLEX_TOKEN is not set' <<<"$out" || { echo "$out" >&2; exit 1; }

      - name: push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=engram-api

      - name: push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: VITE_API_ORIGIN=${{ vars.VITE_API_ORIGIN }}
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=engram-web

      - name: push walker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.walker-meta.outputs.tags }}
          labels: ${{ steps.walker-meta.outputs.labels }}
          cache-from: type=gha,scope=engram-walker
