<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#100e0c" />
    <title>Engram</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The latin cuts every page sets text in, asked for with the document
         rather than when rendered text first needs them, which waits on the
         bundle. `crossorigin` on the same origin too: a font is fetched in
         CORS mode, and a preload that is not would be fetched a second time. -->
    <link rel="preload" href="/src/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/martian-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
