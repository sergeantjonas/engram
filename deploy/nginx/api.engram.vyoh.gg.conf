# The API. Plain HTTP for the same reason as its sibling.
server {
    listen 80;
    listen [::]:80;
    server_name api.engram.vyoh.gg;

    access_log /var/log/nginx/engram-api.access.log;
    error_log /var/log/nginx/engram-api.error.log;

    # A poster import or a library walk answers slowly by nature; the default
    # 60s read timeout would cut one off mid-write.
    location / {
        proxy_pass http://127.0.0.1:2012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The nightly library walk posts the whole dump in one body, 1.1 MB when
    # measured and past nginx's 1m default. Raised on this exact path to the
    # API's own limit, and streamed rather than buffered, so a caller without
    # the secret is refused by the API before the body arrives instead of
    # after nginx has spooled sixteen megabytes of it to disk.
    location = /ingest/plex-library {
        client_max_body_size 16m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:2012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
