# The SPA. Plain HTTP on purpose — see the README beside this file: a vhost
# naming a certificate that does not exist yet fails `nginx -t`, and certbot
# rewrites this in place once it has issued one.
server {
    listen 80;
    listen [::]:80;
    server_name engram.vyoh.gg;

    access_log /var/log/nginx/engram.access.log;
    error_log /var/log/nginx/engram.error.log;

    location / {
        proxy_pass http://127.0.0.1:2011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
